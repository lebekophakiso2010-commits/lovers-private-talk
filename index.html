<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lovers Private Talk ❤️ 1-1</title>
<style>
body{font-family:sans-serif;background:#fff0f3;margin:0}
#lock{position:fixed;inset:0;background:linear-gradient(135deg,#e91e63,#ff4081);color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;padding:20px;text-align:center}
#chat{height:58vh;overflow-y:auto;padding:15px;background:white;margin:10px;border-radius:15px}
.msg{padding:10px 14px;border-radius:18px;margin:8px 0;max-width:75%;word-wrap:break-word}
.me{background:#e91e63;color:white;margin-left:auto}.other{background:#f1f1f1}
#bottom{position:fixed;bottom:0;left:0;right:0;background:white;padding:10px;display:flex;gap:6px;align-items:center}
button{border:none;padding:10px 12px;border-radius:20px;cursor:pointer;font-weight:bold}
#msgInput{flex:1;padding:12px;border-radius:20px;border:1px solid #ddd;outline:none}
#adminPanel{display:none;background:#111;color:white;min-height:100vh;padding:20px}
.card{background:#222;padding:12px;margin:10px 0;border-radius:10px;border-left:4px solid #e91e63}
</style>
</head>
<body>

<div id="lock">
<h1>🔐 Lovers Private Talk</h1>
<h3>1 Person = 1 Partner Only ❤️</h3>
<button onclick="tryJoinRoom()" style="background:white;color:#e91e63;padding:16px 32px;border-radius:30px;font-size:18px">🔓 Join My Partner</button>
<button onclick="loginAdmin()" style="background:#000;color:white;padding:10px 22px;border-radius:20px;margin-top:15px">👑 Admin Login</button>
<p id="lockMsg" style="margin-top:15px;color:yellow"></p>
</div>

<div id="loversUI">
<div style="padding:8px;text-align:center;background:white;margin:10px 10px 0;border-radius:15px">
<h2 style="color:#e91e63">❤️ CODE: <span id="code"></span> <span id="online"></span></h2>
<div id="partnerInfo" style="font-size:12px;color:#e91e63"></div>
<button onclick="startVoiceCall()" style="background:#673ab7;color:white">📞 Voice</button>
<button onclick="startVideoCall()" style="background:#e91e63;color:white">📹 Video</button>
<label style="background:#009688;color:white;padding:10px 12px;border-radius:20px;cursor:pointer">📷<input type="file" accept="image/*" hidden onchange="sendImage(this)"></label>
</div>
<div id="typing" style="padding:0 20px;font-size:12px;color:#e91e63;height:16px"></div>
<div id="chat"></div>
<div id="bottom">
<button id="voiceBtn" onclick="toggleVoiceNote()" style="background:#e91e63;color:white">🎤</button>
<input id="msgInput" placeholder="Type..." oninput="setTyping()" onkeypress="if(event.key==='Enter') sendText()">
<button onclick="sendText()" style="background:#e91e63;color:white">➤</button>
</div>
</div>

<div id="adminPanel">
<h1>👑 ADMIN - STAY LOGGED IN</h1>
<p id="adminEmail"></p><button onclick="logoutAdmin()" style="background:red;color:white">Logout</button> <button onclick="showLovers()">Chat</button>
<input id="search" placeholder="Search CODE..." onkeyup="filterRooms()" style="padding:10px;width:300px;border-radius:8px;border:none">
<div id="stats"></div><div id="admin"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, collection, addDoc, doc, updateDoc, onSnapshot, query, orderBy, serverTimestamp, collectionGroup, getDocs, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";
import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCG-scvS8Z6yp85ggJPBx0t0_aX67cxhac",
  authDomain: "lover-s-private-talk.firebaseapp.com",
  projectId: "lover-s-private-talk",
  storageBucket: "lover-s-private-talk.firebasestorage.app",
  messagingSenderId: "315331696936",
  appId: "1:315331696936:web:955f7726578edc7afc581d"
};
const ALLOWED_ADMIN = "lebekophakiso2010@gmail.com";
const app = initializeApp(firebaseConfig);
const db = getFirestore(app); const storage = getStorage(app); const auth = getAuth(app); const provider = new GoogleAuthProvider();
await setPersistence(auth, browserLocalPersistence);

let LOVE_CODE = localStorage.getItem('LOVE_CODE');
let myId = localStorage.getItem('myId') || 'Lover_'+Math.floor(Math.random()*900+10);
localStorage.setItem('myId', myId);

// 1 PERSON 1 PARTNER LOGIC
window.tryJoinRoom = async()=>{
  if(!LOVE_CODE){ LOVE_CODE=prompt("Enter LOVE CODE"); if(!LOVE_CODE) return; }

  // Check if room already has 2 partners
  const roomRef = doc(db,"rooms",LOVE_CODE);
  const roomSnap = await getDoc(roomRef);

  if(!roomSnap.exists()){
    // First person - create room with partner1 = me
    await setDoc(roomRef,{partner1:myId, partner2:null, createdAt:serverTimestamp(), code:LOVE_CODE});
    localStorage.setItem('LOVE_CODE',LOVE_CODE);
    document.getElementById('code').innerText=LOVE_CODE;
    document.getElementById('lock').style.display='none';
    document.getElementById('partnerInfo').innerText="Waiting for your partner to join... Share CODE: "+LOVE_CODE;
  }else{
    const data = roomSnap.data();
    // If I am already partner1 or partner2, let me in
    if(data.partner1===myId || data.partner2===myId){
      localStorage.setItem('LOVE_CODE',LOVE_CODE);
      document.getElementById('code').innerText=LOVE_CODE;
      document.getElementById('lock').style.display='none';
    }
    // If partner2 empty and I am not partner1, become partner2
    else if(!data.partner2){
      await updateDoc(roomRef,{partner2:myId});
      localStorage.setItem('LOVE_CODE',LOVE_CODE);
      document.getElementById('code').innerText=LOVE_CODE;
      document.getElementById('lock').style.display='none';
    }
    // Room full with 2 different people
    else{
      document.getElementById('lockMsg').innerText="❌ This CODE already has 2 lovers! 1 Person = 1 Partner only. Create new CODE.";
      return;
    }
  }
  startChat();
};

function startChat(){
  document.getElementById('lock').style.display='none';
  // Show partner info
  onSnapshot(doc(db,"rooms",LOVE_CODE), snap=>{
    if(snap.exists()){
      const d=snap.data();
      document.getElementById('partnerInfo').innerText=`Partners: ${d.partner1} ❤️ ${d.partner2||'Waiting...'}`;
    }
  });
}

if(localStorage.getItem('LOVE_CODE')){ LOVE_CODE=localStorage.getItem('LOVE_CODE'); document.getElementById('code').innerText=LOVE_CODE; }

// Auto try join if already had code
if(localStorage.getItem('LOVE_CODE') && localStorage.getItem('unlocked')==='yes'){
  tryJoinRoom();
}

window.unlockApp=()=>{ localStorage.setItem('unlocked','yes'); tryJoinRoom(); };
window.showLovers=()=>{ document.getElementById('adminPanel').style.display='none'; document.getElementById('loversUI').style.display='block'; document.getElementById('lock').style.display='none'; };
window.loginAdmin=async()=>{ await setPersistence(auth,browserLocalPersistence); signInWithPopup(auth,provider); };
window.logoutAdmin=()=>{ localStorage.clear(); signOut(auth).then(()=>location.reload()); };

setInterval(()=>{ if(LOVE_CODE) setDoc(doc(db,"rooms",LOVE_CODE,"presence",myId),{online:true,lastSeen:serverTimestamp(),user:myId},{merge:true}); },4000);
onSnapshot(collection(db,"rooms",LOVE_CODE||'dummy',"presence"), snap=>{ let c=0; snap.forEach(d=>{ if((Date.now()-(d.data().lastSeen?.toMillis()||0))<15000) c++; }); document.getElementById('online').innerText=c>1?`🟢 Online ${c}`:`⚪`; });

let tTimeout; window.setTyping=async()=>{ if(!LOVE_CODE) return; await setDoc(doc(db,"rooms",LOVE_CODE,"typing",myId),{typing:true,user:myId}); clearTimeout(tTimeout); tTimeout=setTimeout(async()=>{await setDoc(doc(db,"rooms",LOVE_CODE,"typing",myId),{typing:false})},2000); };
onSnapshot(collection(db,"rooms",LOVE_CODE||'dummy',"typing"), snap=>{ let txt=""; snap.forEach(d=>{ if(d.id!==myId && d.data().typing) txt=`${d.data().user} typing...`; }); const el=document.getElementById('typing'); if(el) el.innerText=txt; });

let allData=[];
onAuthStateChanged(auth, async(user)=>{
  if(!user) return; if(user.email!==ALLOWED_ADMIN){ alert("DENIED"); await signOut(auth); return; }
  document.getElementById('lock').style.display='none'; document.getElementById('loversUI').style.display='none'; document.getElementById('adminPanel').style.display='block';
  document.getElementById('adminEmail').innerText=user.email+" (stays logged in)";
  const snap=await getDocs(query(collectionGroup(db,"messages"),orderBy("timestamp","desc")));
  let total=0, voices=0, images=0, deleted=0, rooms=new Set();
  snap.forEach(d=>{ const m=d.data(); rooms.add(d.ref.parent.parent.id); total++; if(m.type==='voice') voices++; if(m.type==='image') images++; if(m.isDeleted) deleted++; allData.push({room:d.ref.parent.parent.id,...m}); });
  document.getElementById('stats').innerHTML=`Rooms:${rooms.size} (each 1-1 only) | Msgs:${total} | 🎤${voices} | 🖼️${images} | 🗑️${deleted}`;
  render(allData);
});
function render(list){ const ad=document.getElementById('admin'); ad.innerHTML=""; list.forEach(m=>{ ad.innerHTML+=`<div class="card"><b>${m.room}</b> | ${m.sender}<br>${m.isDeleted?`<span style="color:red">DELETED: "${m.originalText}"</span><br>`:''}${m.type==='voice'?`<audio controls src="${m.audioUrl}" style="width:100%"></audio>`:m.type==='image'?`<img src="${m.imageUrl}" style="max-width:200px">`:`${m.text}`}</div>`; });}
window.filterRooms=()=>{ const s=document.getElementById('search').value.toLowerCase(); render(allData.filter(m=>m.room.toLowerCase().includes(s))); };

let mediaRecorder, audioChunks=[], isRecording=false;
window.toggleVoiceNote=async()=>{ const btn=document.getElementById('voiceBtn'); if(!isRecording){ const stream=await navigator.mediaDevices.getUserMedia({audio:true}); mediaRecorder=new MediaRecorder(stream); audioChunks=[]; mediaRecorder.ondataavailable=e=>audioChunks.push(e.data); mediaRecorder.onstop=async()=>{ const blob=new Blob(audioChunks,{type:'audio/webm'}); const sRef=ref(storage,`voices/${LOVE_CODE}/${Date.now()}.webm`); await uploadBytes(sRef,blob); const url=await getDownloadURL(sRef); await addDoc(collection(db,"rooms",LOVE_CODE,"messages"),{type:"voice",audioUrl:url,sender:myId,timestamp:serverTimestamp(),isDeleted:false,originalText:"[voice]"}); }; mediaRecorder.start(); isRecording=true; btn.innerHTML="⏹️"; }else{ mediaRecorder.stop(); isRecording=false; btn.innerHTML="🎤"; } };
window.sendImage=async(input)=>{ const file=input.files[0]; if(!file) return; const sRef=ref(storage,`images/${LOVE_CODE}/${Date.now()}_${file.name}`); await uploadBytes(sRef,file); const url=await getDownloadURL(sRef); await addDoc(collection(db,"rooms",LOVE_CODE,"messages"),{type:"image",imageUrl:url,sender:myId,timestamp:serverTimestamp(),isDeleted:false,originalText:"[image]"}); };
window.startVoiceCall=()=>window.open(`https://meet.jit.si/LOVE_VOICE_${LOVE_CODE}#config.startWithVideoMuted=true`,'_blank');
window.startVideoCall=()=>window.open(`https://meet.jit.si/LOVE_VIDEO_${LOVE_CODE}`,'_blank');
window.sendText=async()=>{ const i=document.getElementById('msgInput'); if(!i.value.trim()) return; await addDoc(collection(db,"rooms",LOVE_CODE,"messages"),{type:"text",text:i.value,originalText:i.value,isDeleted:false,sender:myId,timestamp:serverTimestamp()}); i.value=""; };
window.deleteMsg=async(id,orig)=>{ if(!confirm("Delete?")) return; await updateDoc(doc(db,"rooms",LOVE_CODE,"messages",id),{isDeleted:true,text:"🚫 Deleted",originalText:orig,deletedAt:serverTimestamp(),deletedBy:myId}); };
onSnapshot(query(collection(db,"rooms",LOVE_CODE||'dummy',"messages"),orderBy("timestamp")), snap=>{ const chatDiv=document.getElementById('chat'); if(!chatDiv) return; chatDiv.innerHTML=""; snap.forEach(d=>{ const m=d.data(); const isMe=m.sender===myId; let inner=m.isDeleted?`<i>${m.text}</i>`:m.type==="voice"?`<audio controls src="${m.audioUrl}" style="width:180px"></audio>`:m.type==="image"?`<img src="${m.imageUrl}" style="max-width:200px;border-radius:10px">`:m.text; chatDiv.innerHTML+=`<div class="msg ${isMe?'me':'other'}">${inner}${!m.isDeleted?`<div style="font-size:10px;opacity:.6;cursor:pointer" onclick="deleteMsg('${d.id}','${(m.originalText||'').replace(/'/g,'')}')">🗑️</div>`:''}</div>`; }); chatDiv.scrollTop=chatDiv.scrollHeight; });
</script>
</body>
</html>
