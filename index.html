<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lovers Talk ❤️</title><style>*{box-sizing:border-box;font-family:system-ui}body{margin:0;background:#000;color:#fff;display:flex;justify-content:center;padding:15px}#app{width:100%;max-width:400px}.card{background:#121212;border-radius:24px;padding:20px;border:1px solid #222;text-align:center}input{width:100%;background:#1e1e1e;border:1px solid #333;border-radius:12px;padding:14px;color:#fff;margin:8px 0}button{width:100%;padding:14px;border-radius:12px;border:none;font-weight:bold;cursor:pointer;background:#ff2d78;color:#fff;margin-top:10px}.btnDark{background:#2a2a2a}#msgs{height:300px;overflow:auto;background:#0e0e0e;border-radius:12px;padding:10px;text-align:left;margin:10px 0}</style></head><body><div id="app"><div id="authDiv"><div class="card"><h2 style="color:#ff2d78">Lovers Private Talk ❤️</h2><input id="email" placeholder="Email"><input id="pass" type="password" placeholder="Password"><button onclick="register()">Register</button><button class="btnDark" onclick="login()">Login</button><p id="debug" style="color:#0f0;font-size:11px;margin-top:10px"></p></div></div><div id="home" style="display:none"><div class="card"><h2 style="color:#ff2d78">LOVE CODE</h2><h1 id="roomId" style="color:#ff2d78">LOVE0000</h1><input id="joinId" placeholder="Enter lover's code"><button onclick="joinRoom()">Join Lover 💕</button><button class="btnDark" onclick="logout()">Logout</button></div></div><div id="room" style="display:none"><div class="card"><h3 id="rTitle" style="color:#ff2d78"></h3><div id="status" style="font-size:12px;color:#0f0"></div><div id="msgs"></div><div id="typing" style="color:#ff2d78;font-size:12px;height:16px"></div><input id="msg" placeholder="Type..." oninput="onTyping()"><button onclick="sendMsg()">Send ❤️</button><button class="btnDark" onclick="call()">📞 Call</button></div></div></div><script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";import{getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";import{getDatabase,ref,push,set,onChildAdded,onValue,remove,onDisconnect,update}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
document.getElementById('debug').innerText='JS Loaded OK - Firebase connecting...';
const cfg={apiKey:"AIzaSyBMkkANofQTPgCLMzG0QwhkcGf-44gEcQI",authDomain:"lover-s-private-room.firebaseapp.com",databaseURL:"https://lover-s-private-room-default-rtdb.firebaseio.com",projectId:"lover-s-private-room",storageBucket:"lover-s-private-room.firebasestorage.app",messagingSenderId:"106232747956",appId:"1:106232747956:web:8e090e47568ee2d05944e1"};
const app=initializeApp(cfg);const auth=getAuth(app);const db=getDatabase(app);let curRoom="",curEmail="";
const $=id=>document.getElementById(id);
window.register=()=>createUserWithEmailAndPassword(auth,$("email").value,$("pass").value).then(()=>alert("Registered, now Login")).catch(e=>{$("debug").innerText=e.message;alert(e.message)});
window.login=()=>signInWithEmailAndPassword(auth,$("email").value,$("pass").value).then(async u=>{curEmail=u.user.email;$("debug").innerText='Logged in: '+curEmail;const safe=curEmail.replace(/\./g,"_");const snap=await new Promise(r=>{onValue(ref(db,"user_pair/"+safe),s=>r(s),{onlyOnce:true})});if(snap.exists()){curRoom=snap.val().room;$("authDiv").style.display="none";$("home").style.display="none";$("room").style.display="block";$("rTitle").innerText=curRoom;setupPresence();listen();listenTyping();listenPresence();return;}$("authDiv").style.display="none";$("home").style.display="block";createCode();}).catch(e=>{$("debug").innerText=e.message;alert(e.message)});
async function createCode(){const id="LOVE"+Math.floor(1000+Math.random()*9000);curRoom=id;$("roomId").innerText=id;await set(ref(db,"rooms/"+id),{createdBy:curEmail,members:{[curEmail.replace(/\./g,"_")]:curEmail},locked:false});await setupPresence();}
window.joinRoom=async()=>{const id=$("joinId").value.trim().toUpperCase();const snap=await new Promise(r=>{onValue(ref(db,"rooms/"+id),s=>r(s),{onlyOnce:true})});if(!snap.exists())return alert("Not found");const d=snap.val();if(d.locked)return alert("Locked");const safe=curEmail.replace(/\./g,"_");await set(ref(db,"rooms/"+id+"/members/"+safe),curEmail);await set(ref(db,"rooms/"+id+"/locked"),true);await set(ref(db,"user_pair/"+safe),{room:id});await set(ref(db,"user_pair/"+(d.createdBy||"").replace(/\./g,"_")),{room:id});curRoom=id;$("home").style.display="none";$("room").style.display="block";$("rTitle").innerText=id;setupPresence();listen();listenTyping();listenPresence();};
async function setupPresence(){const safe=curEmail.replace(/\./g,"_");const r=ref(db,"rooms/"+curRoom+"/presence/"+safe);await set(r,{email:curEmail,online:true,lastSeen:Date.now()});onDisconnect(r).set({email:curEmail,online:false,lastSeen:Date.now()});}
function listenPresence(){onValue(ref(db,"rooms/"+curRoom+"/presence"),s=>{const v=s.val()||{};let other=null;Object.values(v).forEach(o=>{if(o.email!==curEmail)other=o;});$("status").innerText=other?(other.online?"🟢 "+other.email+" Online":"⚪ Last seen"):"Waiting...";});}
window.onTyping=()=>{const safe=curEmail.replace(/\./g,"_");set(ref(db,"rooms/"+curRoom+"/typing/"+safe),{email:curEmail});setTimeout(()=>remove(ref(db,"rooms/"+curRoom+"/typing/"+safe)),1500);};
function listenTyping(){onValue(ref(db,"rooms/"+curRoom+"/typing"),s=>{const v=s.val()||{};let show=false;Object.values(v).forEach(t=>{if(t.email!==curEmail)show=true;});$("typing").innerText=show?"Typing...":"";});}
function listen(){onChildAdded(ref(db,"rooms/"+curRoom+"/chats"),s=>{const m=s.val();$("msgs").innerHTML+=`<div style="margin:6px 0;padding:8px;background:${m.by===curEmail?'#2a1520':'#1a1a1a'};border-radius:10px"><b style="font-size:10px;color:#ff2d78">${m.by}</b><br>${m.text}<br><small style="font-size:9px">${new Date(m.time).toLocaleTimeString()} ${m.seen?'✓✓':m.by===curEmail?'✓':''}</small></div>`;$("msgs").scrollTop=9999;if(m.by!==curEmail)update(ref(db,"rooms/"+curRoom+"/chats/"+s.key),{seen:true});});}
window.sendMsg=()=>{const t=$("msg").value;if(!t)return;push(ref(db,"rooms/"+curRoom+"/chats"),{by:curEmail,text:t,time:Date.now(),seen:false});$("msg").value="";};
window.call=()=>window.open(`https://meet.jit.si/${curRoom}-voice`,"_blank");
window.logout=()=>location.reload();
</script></body></html>
