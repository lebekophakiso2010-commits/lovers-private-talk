<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lovers Private Talk ❤️</title>
<style>
body{margin:0;font-family:sans-serif;background:#0f0f0f;color:#fff;display:flex;flex-direction:column;height:100vh}
#header{background:#e91e63;padding:15px;text-align:center;font-weight:bold}
#messages{flex:1;overflow-y:auto;padding:10px}
.msg{margin:8px;padding:10px 15px;border-radius:18px;max-width:75%;word-wrap:break-word}
.me{background:#e91e63;margin-left:auto}
.her{background:#333}
#inputArea{display:flex;padding:10px;background:#222}
#msgInput{flex:1;padding:12px;border-radius:25px;border:none;outline:none}
#sendBtn{background:#e91e63;border:none;color:#fff;padding:12px 20px;border-radius:25px;margin-left:8px;font-weight:bold}
</style>
</head>
<body>
<div id="header">❤️ Leko & Letele Thabo Private ❤️<br><small>Works on Vodacom/MTN Data 🇿🇦</small></div>
<div id="messages"></div>
<div id="inputArea">
<input id="msgInput" placeholder="Type love message...">
<button id="sendBtn">Send ❤️</button>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const firebaseConfig = {
apiKey: "AIzaSyDUMMY_REPLACE_ME",
authDomain: "lovers-private-talk.firebaseapp.com",
databaseURL: "https://lovers-private-talk-default-rtdb.firebaseio.com",
projectId: "lovers-private-talk",
storageBucket: "lovers-private-talk.appspot.com",
messagingSenderId: "123456789",
appId: "1:123456789:web:abcdef"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const chatRef = ref(db, "lovers_chat");
const name = prompt("Who are you? Type: Leko OR Letele") || "Leko";
const messagesDiv = document.getElementById("messages");
const input = document.getElementById("msgInput");
const btn = document.getElementById("sendBtn");
btn.onclick = () => {
if(!input.value) return;
push(chatRef, { user: name, text: input.value, time: Date.now() });
input.value = "";
};
input.addEventListener("keypress", (e)=>{ if(e.key==="Enter") btn.click(); });
onChildAdded(chatRef, (snap) => {
const m = snap.val();
const div = document.createElement("div");
div.className = "msg " + (m.user === name ? "me" : "her");
div.innerHTML = `<b>${m.user}</b><br>${m.text}`;
messagesDiv.appendChild(div);
messagesDiv.scrollTop = messagesDiv.scrollHeight;
});
</script>
</body>
</html>
