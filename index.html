<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lovers Private Talk 💖</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#e91e63">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-512.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,sans-serif}
body{background:#0f0f0f;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#1a1a1a;border-radius:24px;padding:28px;width:100%;max-width:380px;border:1px solid #2a2a2a;box-shadow:0 20px 60px rgba(233,30,99,.2)}
h1{font-size:24px;text-align:center;background:linear-gradient(90deg,#ff4d8d,#e91e63);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
.sub{color:#888;text-align:center;font-size:13px;margin-bottom:22px}
input{width:100%;padding:14px 16px;background:#252525;border:1px solid #333;border-radius:12px;color:#fff;margin:8px 0;font-size:15px;outline:none}
input:focus{border-color:#e91e63}
button{width:100%;padding:14px;background:linear-gradient(90deg,#ff4d8d,#e91e63);border:none;border-radius:12px;color:#fff;font-weight:700;font-size:15px;margin-top:12px;cursor:pointer}
button.secondary{background:#252525;border:1px solid #333}
.code-box{background:#252525;border:1.5px dashed #e91e63;border-radius:14px;padding:16px;text-align:center;margin:16px 0}
.code{font-size:32px;letter-spacing:4px;font-weight:900;color:#ff4d8d}
.chat-area{display:none;width:100%;max-width:420px;height:85vh;flex-direction:column;background:#1a1a1a;border-radius:20px;overflow:hidden;border:1px solid #2a2a2a}
.chat-header{padding:14px 16px;background:#252525;display:flex;justify-content:space-between;align-items:center}
#messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:75%;padding:10px 14px;border-radius:18px;font-size:14px}
.msg.me{align-self:flex-end;background:linear-gradient(90deg,#ff4d8d,#e91e63);border-bottom-right-radius:4px}
.msg.them{align-self:flex-start;background:#2a2a2a;border-bottom-left-radius:4px}
.input-row{display:flex;gap:8px;padding:12px;background:#111}
.input-row input{margin:0;flex:1}
.input-row button{width:60px;margin:0}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="auth-section" style="width:100%;display:flex;justify-content:center">
<div class="card">
<h1>Lovers Private Talk 💖</h1>
<p class="sub">Private room for only 2. Just you & your lover.</p>
<div id="loginForm">
<input type="email" id="email" placeholder="Your email">
<input type="password" id="password" placeholder="Password">
<button onclick="login()">Login</button>
<button class="secondary" onclick="signup()">Create Account</button>
</div>
<div id="pairing" class="hidden">
<div class="code-box"><p style="font-size:12px;color:#aaa">YOUR LOVE CODE</p><div class="code" id="myCode">LOVE----</div></div>
<div id="qrcode" style="display:flex;justify-content:center;margin:10px 0"></div>
<input type="text" id="partnerCode" placeholder="Enter lover's code">
<button onclick="joinRoom()">Join Lover's Room 💕</button>
<button class="secondary" onclick="logout()">Logout</button>
</div>
<p style="font-size:11px;color:#555;text-align:center;margin-top:14px">🔒 Private & secured with Firebase</p>
</div>
</div>
<div class="chat-area" id="chatArea">
<div class="chat-header"><span>💖 <b>Lovers Room</b></span><button style="width:auto;padding:6px 12px;font-size:12px" onclick="logout()">Exit</button></div>
<div id="messages"></div>
<div class="input-row"><input type="text" id="msgInput" placeholder="Type sweet..."><button onclick="sendMsg()">💌</button></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getDatabase, ref, set, get, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "YOUR_API_KEY_HERE",
  authDomain: "lovers-private-talk.firebaseapp.com",
  databaseURL: "https://lovers-private-talk-default-rtdb.firebaseio.com",
  projectId: "lovers-private-talk",
  storageBucket: "lovers-private-talk.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
let currentUser=null,myPairCode=null,currentRoomId=null;
function generateCode(){return "LOVE"+Math.floor(1000+Math.random()*9000);}
window.signup=async()=>{
 const e=document.getElementById('email').value.trim();
 const p=document.getElementById('password').value;
 if(!e||p.length<6)return alert("Email + 6 char pass");
 try{
  const cred=await createUserWithEmailAndPassword(auth,e,p);
  myPairCode=generateCode();
  await set(ref(db,'users/'+cred.user.uid),{email:e,code:myPairCode,paired:false});
  await set(ref(db,'codes/'+myPairCode),{uid:cred.user.uid});
  showPairing();
 }catch(err){alert(err.message)}
}
window.login=async()=>{
 const e=document.getElementById('email').value.trim();
 const p=document.getElementById('password').value;
 try{await signInWithEmailAndPassword(auth,e,p);}catch(err){alert(err.message)}
}
onAuthStateChanged(auth,async(user)=>{
 if(user){
  currentUser=user;
  const snap=await get(ref(db,'users/'+user.uid));
  if(snap.exists()){
   const data=snap.val();myPairCode=data.code;
   if(data.paired&&data.roomId)enterChat(data.roomId);else showPairing();
  }
 }
});
function showPairing(){
 document.getElementById('loginForm').classList.add('hidden');
 document.getElementById('pairing').classList.remove('hidden');
 document.getElementById('myCode').innerText=myPairCode;
 document.getElementById('qrcode').innerHTML="";
 new QRCode(document.getElementById('qrcode'),{text:myPairCode,width:120,height:120,colorDark:"#e91e63",colorLight:"#1a1a1a"});
}
window.joinRoom=async()=>{
 const code=document.getElementById('partnerCode').value.trim().toUpperCase();
 if(code===myPairCode)return alert("Can't use own code");
 const snap=await get(ref(db,'codes/'+code));
 if(!snap.exists())return alert("Code not found");
 const partnerUid=snap.val().uid;
 const roomId=[currentUser.uid,partnerUid].sort().join('_');
 await set(ref(db,'rooms/'+roomId),{users:[currentUser.uid,partnerUid]});
 await set(ref(db,'users/'+currentUser.uid+'/paired'),true);
 await set(ref(db,'users/'+currentUser.uid+'/roomId'),roomId);
 await set(ref(db,'users/'+partnerUid+'/paired'),true);
 await set(ref(db,'users/'+partnerUid+'/roomId'),roomId);
 enterChat(roomId);
}
function enterChat(roomId){
 currentRoomId=roomId;
 document.getElementById('auth-section').style.display='none';
 document.getElementById('chatArea').style.display='flex';
 const msgRef=ref(db,'rooms/'+roomId+'/messages');
 onChildAdded(msgRef,(snap)=>{
  const m=snap.val();addMessage(m.text,m.uid===currentUser.uid);
 });
}
function addMessage(text,isMe){
 const div=document.createElement('div');
 div.className='msg '+(isMe?'me':'them');div.innerText=text;
 document.getElementById('messages').appendChild(div);
 document.getElementById('messages').scrollTop=document.getElementById('messages').scrollHeight;
}
window.sendMsg=async()=>{
 const input=document.getElementById('msgInput');
 const text=input.value.trim();if(!text||!currentRoomId)return;
 input.value="";await push(ref(db,'rooms/'+currentRoomId+'/messages'),{uid:currentUser.uid,text,time:Date.now()});
}
window.logout=async()=>{await signOut(auth);location.reload();}
document.getElementById('msgInput').addEventListener('keypress',e=>{if(e.key==='Enter')sendMsg();});
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}
</script>
</body>
</html>
