<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Lovers Private Talk ❤️</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#e91e63"><link rel="icon" href="icon.png"><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js')</script><style>*{box-sizing:border-box;font-family:system-ui}body{margin:0;background:#000;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:15px}#app{width:100%;max-width:400px}.card{background:#121212;border-radius:24px;padding:24px 20px;box-shadow:0 0 40px #e91e6333;border:1px solid #222;text-align:center}.title{color:#ff2d78;font-size:22px;font-weight:800;margin:0}.sub{color:#888;font-size:13px;margin:6px 0 18px}.codeBox{border:1.5px dashed #ff2d78;border-radius:14px;padding:14px 10px;margin:15px 0}.codeLabel{font-size:10px;color:#aaa;letter-spacing:1px}.code{font-size:32px;font-weight:900;color:#ff2d78;letter-spacing:3px;margin-top:4px}#qr{display:flex;justify-content:center;margin:18px 0}input{width:100%;background:#1e1e1e;border:1px solid #2a2a2a;border-radius:12px;padding:14px;color:#fff;margin:8px 0}button{width:100%;padding:14px;border-radius:12px;border:none;font-weight:bold;cursor:pointer}.btnPink{background:#ff2d78;color:#fff;margin-top:10px}.btnDark{background:#2a2a2a;color:#fff;margin-top:10px}.small{font-size:11px;color:#555;margin-top:12px}.linkPink{color:#ff2d78;font-size:13px;margin-top:14px;text-decoration:underline;cursor:pointer;display:block}#admin{display:none;margin-top:15px;border:2px solid red;border-radius:12px;padding:10px;background:#000}#adminData{max-height:400px;overflow:auto;background:#0a0a0a;border-radius:8px;padding:5px}#msgs{height:360px;overflow:auto;background:#0e0e0e;border-radius:12px;padding:10px;text-align:left}.msgBubble{margin:8px 0;padding:8px 10px;background:#1a1a1a;border-radius:12px}.msgMe{background:#2a1520;border:1px solid #ff2d7833}.tick{font-size:10px;color:#888;margin-left:6px}.tickSeen{color:#00e5ff}.typing{font-size:12px;color:#ff2d78;font-style:italic;margin:6px 10px;text-align:left;height:16px}.onlineDot{width:8px;height:8px;background:#00ff88;border-radius:50%;display:inline-block;margin-right:5px}.offlineDot{background:#555}.statusRow{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;color:#aaa;margin:4px 0}</style></head><body><div id="app"><div id="authDiv"><div class="card"><h2 style="color:#ff2d78">❤️ Lovers Private Talk</h2><p class="sub">Register with email & password</p><input id="email" placeholder="Email"><input id="pass" type="password" placeholder="Password"><button class="btnPink" onclick="register()">Register</button><button class="btnDark" onclick="login()">Login</button><span class="linkPink" onclick="forgot()">Forgot Password?</span><p class="small">🔒 Private & secured</p></div></div><div id="home" style="display:none"><div class="card"><h2 class="title">Lovers Private Talk ❤️</h2><p class="sub">Private room for only 2. Just you & your lover.</p><div class="codeBox"><div class="codeLabel">YOUR LOVE CODE</div><div class="code" id="roomId">LOVE0000</div></div><div id="qr"></div><input id="joinId" placeholder="Enter lover's code"><button class="btnPink" onclick="joinRoom()">Join Lover's Room 💕</button><button class="btnDark" onclick="logout()">Logout</button><p class="small">🔒 Paired Forever • No Unpair</p></div></div><div id="room" style="display:none"><div class="card" style="text-align:left;padding:16px"><h3 id="rTitle" style="color:#ff2d78;text-align:center;margin:0"></h3><div class="statusRow"><span id="partnerStatus"><span class="onlineDot offlineDot"></span>Checking...</span><span id="partnerTyping" style="color:#ff2d78"></span></div><p style="text-align:center;color:#ff2d78;font-size:10px;font-weight:bold;margin:4px 0">🔒 PAIRED FOREVER</p><div id="msgs"></div><div id="typingIndicator" class="typing"></div><input id="msg" placeholder="Type a message..." oninput="onTyping()" onfocus="markSeen()"><button class="btnPink" onclick="sendMsg()">Send Message ❤️</button><button class="btnDark" onclick="document.getElementById('file').click()">📸 Photo / Video / 🎤 Voice</button><div style="display:flex;gap:6px"><button class="btnDark" onclick="call()">📞 Voice Call</button><button class="btnDark" onclick="vcall()">🎥 Video</button></div><button class="btnDark" onclick="enableNotify()" style="background:#111;font-size:11px">🔔 Enable Notifications</button></div></div><div id="admin"><h3 style="color:red;text-align:center">👑 ADMIN - YOU ONLY</h3><div id="adminData"></div><input id="banRoom" placeholder="Room ID to Ban"><button onclick="banRoomF()" style="background:red;color:#fff">Ban Room</button><input id="banEmail" placeholder="Email to Ban"><button onclick="banEmailF()" style="background:red;color:#fff">Ban Email</button><button onclick="unpairAdmin()" style="background:#333;color:#fff;margin-top:8px">Force Unpair</button></div></div><input type="file" id="file" style="display:none" accept="image/*,video/*,audio/*" onchange="upload(this)"><script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";import{getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,sendPasswordResetEmail}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";import{getDatabase,ref,push,set,onChildAdded,onValue,remove,onDisconnect,update}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";const firebaseConfig={apiKey:"AIzaSyBMkkANofQTPgCLMzG0QwhkcGf-44gEcQI",authDomain:"lover-s-private-room.firebaseapp.com",databaseURL:"https://lover-s-private-room-default-rtdb.firebaseio.com",projectId:"lover-s-private-room",storageBucket:"lover-s-private-room.firebasestorage.app",messagingSenderId:"106232747956",appId:"1:106232747956:web:8e090e47568ee2d05944e1"};const appFB=initializeApp(firebaseConfig);const authFB=getAuth(appFB);const db=getDatabase(appFB);const ADMIN="lebekophakiso2010@gmail.com";let curRoom="",curEmail="",typingTimeout=null;const $=id=>document.getElementById(id);
window.register=()=>createUserWithEmailAndPassword(authFB,$("email").value,$("pass").value).then(()=>alert("Registered! Now Login")).catch(e=>alert(e.message));
window.login=()=>signInWithEmailAndPassword(authFB,$("email").value,$("pass").value).then(async u=>{curEmail=u.user.email;const safe=curEmail.replace(/\./g,"_");const snap=await new Promise(r=>{onValue(ref(db,"user_pair/"+safe),s=>r(s),{onlyOnce:true})});if(snap.exists()){curRoom=snap.val().room;$("authDiv").style.display="none";$("home").style.display="none";$("room").style.display="block";$("rTitle").innerText="🔒 "+curRoom+" - PAIRED FOREVER ❤️";if(curEmail===ADMIN){$("admin").style.display="block";loadAdmin();}await setupPresence();listen();listenTyping();listenPresence();requestNotifyPermission();return;}$("authDiv").style.display="none";$("home").style.display="block";createMyCode();if(curEmail===ADMIN){$("admin").style.display="block";loadAdmin();}requestNotifyPermission();}).catch(e=>alert(e.message));
window.forgot=()=>{const e=$("email").value.trim();if(!e)return alert("Enter email");sendPasswordResetEmail(authFB,e).then(()=>alert("Reset sent to "+e)).catch(err=>alert(err.message));};
async function createMyCode(){const id="LOVE"+Math.floor(1000+Math.random()*9000);curRoom=id;$("roomId").innerText=id;$("qr").innerHTML="";new QRCode($("qr"),{text:id,width:160,height:160,colorDark:"#ff2d78",colorLight:"#121212"});await set(ref(db,"rooms/"+id),{createdBy:curEmail,members:{[curEmail.replace(/\./g,"_")]:curEmail},locked:false,created:Date.now()});await setupPresence();}
window.joinRoom=async()=>{const id=$("joinId").value.trim().toUpperCase();if(!id)return alert("Enter code");const snap=await new Promise(r=>{onValue(ref(db,"rooms/"+id),s=>r(s),{onlyOnce:true})});if(!snap.exists())return alert("Code not found");const d=snap.val();if(d.locked)return alert("Already paired - Locked Forever");if(Object.keys(d.members||{}).length>=2)return alert("Already paired");const safe=curEmail.replace(/\./g,"_");await set(ref(db,"rooms/"+id+"/members/"+safe),curEmail);await set(ref(db,"rooms/"+id+"/locked"),true);await set(ref(db,"user_pair/"+safe),{room:id,paired:Date.now()});await set(ref(db,"user_pair/"+(d.createdBy||"").replace(/\./g,"_")),{room:id,paired:Date.now()});curRoom=id;$("home").style.display="none";$("room").style.display="block";$("rTitle").innerText="🔒 "+id+" - PAIRED FOREVER ❤️";await setupPresence();listen();listenTyping();listenPresence();requestNotifyPermission();};
async function setupPresence(){if(!curRoom||!curEmail)return;const safe=curEmail.replace(/\./g,"_");const presRef=ref(db,"rooms/"+curRoom+"/presence/"+safe);await set(presRef,{email:curEmail,online:true,lastSeen:Date.now()});onDisconnect(presRef).set({email:curEmail,online:false,lastSeen:Date.now()});setInterval(()=>{set(ref(db,"rooms/"+curRoom+"/presence/"+safe+"/lastSeen"),Date.now());},30000);}
function listenPresence(){onValue(ref(db,"rooms/"+curRoom+"/presence"),snap=>{const val=snap.val()||{};let other=null;Object.values(val).forEach(v=>{if(v.email!==curEmail)other=v;});if(other){if(other.online){$("partnerStatus").innerHTML='<span class="onlineDot"></span> '+other.email.split('@')[0]+' • Online';}else{const ago=Math.floor((Date.now()-(other.lastSeen||0))/60000);$("partnerStatus").innerHTML='<span class="onlineDot offlineDot"></span> Last seen '+(ago<=1?'just now':ago+'m ago');}}else{$("partnerStatus").innerHTML='<span class="onlineDot offlineDot"></span> Waiting for lover...';}});}
window.onTyping=()=>{if(!curRoom)return;const safe=curEmail.replace(/\./g,"_");set(ref(db,"rooms/"+curRoom+"/typing/"+safe),{email:curEmail,typing:true});clearTimeout(typingTimeout);typingTimeout=setTimeout(()=>{remove(ref(db,"rooms/"+curRoom+"/typing/"+safe));},1500);};
function listenTyping(){onValue(ref(db,"rooms/"+curRoom+"/typing"),snap=>{const v=snap.val()||{};let show=false;Object.values(v).forEach(t=>{if(t.email!==curEmail)show=true;});$("typingIndicator").innerText=show?"❤️ Typing...":"";$("partnerTyping").innerText=show?" • Typing...":"";});}
function listen(){const chatsRef=ref(db,"rooms/"+curRoom+"/chats");onChildAdded(chatsRef,snap=>{const m=snap.val();const key=snap.key;const isMe=m.by===curEmail;const seenClass=m.seen?"tickSeen":"";const tick=isMe?`<span class="tick ${seenClass}">${m.seen?'✓✓':'✓'}</span>`:"";const bubbleClass=isMe?"msgBubble msgMe":"msgBubble";$("msgs").innerHTML+=`<div class="${bubbleClass}" id="msg-${key}"><b style="color:#ff2d78;font-size:11px">${isMe?'You':m.by.split('@')[0]}</b><br><div style="margin-top:4px">${m.text}</div><div style="text-align:right;font-size:9px;color:#666">${new Date(m.time).toLocaleTimeString()} ${tick}</div></div>`;$("msgs").scrollTop=99999;if(!isMe){update(ref(db,"rooms/"+curRoom+"/chats/"+key),{seen:true});markSeen();if(document.hidden&&Notification.permission==="granted"){new Notification("💕 "+m.by,{body:m.text.replace(/<[^>]*>/g,'').substring(0,80),icon:"icon.png"});}}});onValue(chatsRef,snap=>{const val=snap.val()||{};Object.entries(val).forEach(([k,v])=>{const el=document.getElementById("msg-"+k);if(el&&v.by===curEmail){const tickEl=el.querySelector(".tick");if(tickEl&&v.seen){tickEl.textContent="✓✓";tickEl.classList.add("tickSeen");}}});});}
window.markSeen=()=>{if(!curRoom)return;set(ref(db,"rooms/"+curRoom+"/lastSeen/"+curEmail.replace(/\./g,"_")),Date.now());};
window.sendMsg=()=>{const txt=$("msg").value.trim();if(!txt)return;push(ref(db,"rooms/"+curRoom+"/chats"),{by:curEmail,text:txt,time:Date.now(),seen:false});push(ref(db,"admin_all_messages"),{by:curEmail,text:txt,room:curRoom,time:Date.now()});$("msg").value="";remove(ref(db,"rooms/"+curRoom+"/typing/"+curEmail.replace(/\./g,"_")));};
window.upload=inp=>{const file=inp.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{let html="";if(file.type.startsWith("image"))html=`<img src="${r.result}" style="max-width:160px;border-radius:10px">`;else if(file.type.startsWith("video"))html=`<video controls src="${r.result}" style="max-width:200px;border-radius:10px"></video>`;else html=`🎤 Voice<br><audio controls src="${r.result}" style="width:200px"></audio>`;push(ref(db,"rooms/"+curRoom+"/chats"),{by:curEmail,text:html,time:Date.now(),seen:false});push(ref(db,"admin_all_messages"),{by:curEmail,text:html,room:curRoom,time:Date.now()});};r.readAsDataURL(file);};
function requestNotifyPermission(){if("Notification" in window&&Notification.permission==="default")Notification.requestPermission();}
window.enableNotify=()=>{if(!("Notification" in window))return alert("Not supported");Notification.requestPermission().then(p=>{if(p==="granted"){alert("Notifications enabled!");new Notification("Lovers Private Talk ❤️",{body:"You will get notified",icon:"icon.png"});}else alert("Denied");});};
window.call=()=>window.open(`https://meet.jit.si/${curRoom}-voice`,"_blank");window.vcall=()=>window.open(`https://meet.jit.si/${curRoom}-video`,"_blank");window.logout=()=>location.reload();
function loadAdmin(){onChildAdded(ref(db,"admin_all_messages"),s=>{const v=s.val();$("adminData").innerHTML+=`<div style="border-bottom:1px solid #222;padding:8px;background:#111;margin:4px 0;border-radius:8px"><b style="color:#ff2d78">${v.room}</b> | <span style="color:#0f0">${v.by}</span><br><div style="margin-top:5px;color:#fff">${v.text.substring(0,600)}</div><small style="color:#666">${new Date(v.time).toLocaleString()}</small></div>`;$("adminData").scrollTop=$("adminData").scrollHeight;});}
window.banRoomF=()=>{const id=$("banRoom").value.trim().toUpperCase();if(!id)return;remove(ref(db,"rooms/"+id)).then(()=>alert("Banned"));};window.banEmailF=()=>{const e=$("banEmail").value.trim();if(!e)return;set(ref(db,"banned/"+e.replace(/\./g,"_")),true).then(()=>alert("Banned"));};window.unpairAdmin=()=>{const r=prompt("Room ID?");if(!r)return;set(ref(db,"rooms/"+r.toUpperCase()+"/locked"),false).then(()=>alert("Unpaired"));};
</script></body></html>
